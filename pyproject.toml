[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daru"
dynamic = ["version"]
description = "Automatic localization of DWG/DXF, PDF, and DOCX documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "boto3",
    "ezdxf",
    "deep-translator",
    "deepl",
    "openai>=2.41.1",
    "pdf2image",
    "pytesseract",
    "PyPDF2",
    "pymupdf>=1.27.2.2",
    "Pillow",
    "opencv-python",
    "easyocr",
    "lxml",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
daru-gui = "daru.gui.app:main"
daru-translate = "daru.dxf.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "daru.__version__"}
